openapi: 3.0.0
info:
  title: thefem.ru API
  version: 1.0.0

paths:
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <function_id>
        service_account_id: <service_account_id>
        payload_format_version: "0.1"

  /{path+}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <function_id>
        service_account_id: <service_account_id>
        payload_format_version: "0.1"
